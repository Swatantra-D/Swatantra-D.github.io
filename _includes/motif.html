{%- comment -%}
  Decorative brain-network motif (nodes and edges). Purely visual: aria-hidden.
  {% include motif.html %} or {% include motif.html class="footer-motif" %}
{%- endcomment -%}
<svg class="{{ include.class | default: 'motif' }}" viewBox="0 0 520 360" aria-hidden="true" focusable="false">
  <g>
    <line x1="60" y1="210" x2="150" y2="120"/><line x1="150" y1="120" x2="250" y2="90"/>
    <line x1="150" y1="120" x2="210" y2="210"/><line x1="60" y1="210" x2="210" y2="210"/>
    <line x1="210" y1="210" x2="250" y2="90"/><line x1="250" y1="90" x2="360" y2="70"/>
    <line x1="250" y1="90" x2="330" y2="170"/><line x1="210" y1="210" x2="330" y2="170"/>
    <line x1="330" y1="170" x2="360" y2="70"/><line x1="360" y1="70" x2="460" y2="120"/>
    <line x1="330" y1="170" x2="460" y2="120"/><line x1="330" y1="170" x2="400" y2="270"/>
    <line x1="210" y1="210" x2="270" y2="300"/><line x1="270" y1="300" x2="400" y2="270"/>
    <line x1="400" y1="270" x2="480" y2="230"/><line x1="460" y1="120" x2="480" y2="230"/>
    <line x1="60" y1="210" x2="120" y2="300"/><line x1="120" y1="300" x2="270" y2="300"/>
  </g>
  <g>
    <circle cx="60" cy="210" r="5" style="--d:.1"/><circle cx="150" cy="120" r="6" style="--d:.2"/>
    <circle class="m-hub" cx="250" cy="90" r="7" style="--d:.3"/><circle cx="210" cy="210" r="6" style="--d:.35"/>
    <circle cx="360" cy="70" r="5" style="--d:.45"/><circle class="m-hub" cx="330" cy="170" r="8" style="--d:.5"/>
    <circle cx="460" cy="120" r="5" style="--d:.6"/><circle cx="400" cy="270" r="6" style="--d:.65"/>
    <circle cx="270" cy="300" r="5" style="--d:.7"/><circle cx="480" cy="230" r="4" style="--d:.75"/>
    <circle cx="120" cy="300" r="4" style="--d:.8"/>
  </g>
</svg>
